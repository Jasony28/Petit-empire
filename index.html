<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3354">
<meta name="description" content="Jeu de gestion : achète, revends et fais grandir ta ville.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Empire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Petit Empire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen phone game — sticky cash bar, a living 2D town, news strip, event banners, scrolling panel, fixed bottom tabs */
:root{
  --bg:#e7f0ec; --panel:#ffffff; --ink:#1b2932; --muted:#566a74; --line:#d0dedd; --chip:#eef5f2;
  --sky:#bfe0ef; --night:#1f3354; --ground:#8dbd86;
  --accent:#d4512a; --on-accent:#ffffff; --gold:#e09d14; --good:#1f8456; --bad:#c03b32; --warn:#c77a0a;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --panel:#16232a; --ink:#e5eef0; --muted:#93a8b1; --line:#283a43; --chip:#1d2d35;
  --sky:#3d6f8f; --night:#0b1529; --ground:#3f6b45;
  --accent:#f07a4c; --on-accent:#1d0d05; --gold:#f2b53a; --good:#4cc487; --bad:#f06c62; --warn:#f0a440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --panel:#16232a; --ink:#e5eef0; --muted:#93a8b1; --line:#283a43; --chip:#1d2d35;
  --sky:#3d6f8f; --night:#0b1529; --ground:#3f6b45;
  --accent:#f07a4c; --on-accent:#1d0d05; --gold:#f2b53a; --good:#4cc487; --bad:#f06c62; --warn:#f0a440; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.gear{border:1px solid var(--line);background:var(--chip);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:19px;cursor:pointer;flex:none}
.gear.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.logo{font:400 17px/1.05 var(--display);color:var(--accent);letter-spacing:.01em;min-width:0}
.logo small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:0;margin-top:3px;white-space:nowrap}
.cash{margin-left:auto;text-align:right;min-width:0}
.cash b{display:block;font:400 24px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.cash small{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.cash b.neg{color:var(--bad)}
.townwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.townwrap::-webkit-scrollbar{display:none}
#town{display:block;height:170px;touch-action:pan-x}
.townbox{position:relative}
.viewbtn{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:30px;border:0;border-radius:10px;padding:6px 10px;font:800 12px var(--body);background:rgba(0,0,0,.45);color:#fff;cursor:pointer}
.planinfo{padding-block:8px;font-size:13px;background:var(--chip);border-bottom:1px solid var(--line);color:var(--ink)}
.planinfo b{font-weight:900}
#todo:not(:empty){padding-top:12px}
.todo{display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px}
.todo .head{display:flex;align-items:center;gap:8px;font-weight:900}
.todo .head .sp{margin-left:auto;display:flex;gap:4px}
.todo .item{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.todo .item.hot{border-color:var(--bad)}
.todo .txt{flex:1;min-width:0;font-size:13.5px;font-weight:800}
.todo .txt small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.todo .act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.cities{display:flex;flex-wrap:wrap;gap:6px}
.cities .btn.on{outline:3px solid var(--gold)}
.news{display:flex;gap:8px;align-items:baseline;padding-block:8px;border-bottom:1px solid var(--line);background:var(--chip);font-size:13px;min-height:36px}
.news .tag{font:500 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;flex:none}
#banner{display:flex;flex-direction:column;gap:8px}
#banner:not(:empty){padding-top:12px}
.ev{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--bad);background:var(--panel)}
.ev.special{border-color:var(--gold)}
main{padding-block:14px 96px;display:flex;flex-direction:column;gap:10px}
h2{font:400 20px/1.1 var(--display);margin:6px 0 0;text-wrap:balance}
h3{font:800 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row.alert{border-color:var(--bad)}
.row.gold{border-color:var(--gold)}
.top{display:flex;align-items:center;gap:10px}
.name{font-weight:900;font-size:16px;min-width:0}
.name small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.price{margin-left:auto;text-align:right;font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{display:block;font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)} .mut{color:var(--muted)} .warn{color:var(--warn)}
canvas.spark{width:88px;height:32px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font:500 11.5px var(--mono);color:var(--ink);white-space:nowrap}
.pill.bad{background:var(--bad);color:var(--on-accent)}
.pill.gold{background:var(--gold);color:#2a1a00}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btns.two{grid-template-columns:1fr 1fr}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.btns.one{grid-template-columns:1fr}
.btn{font:800 14px var(--body);border:0;border-radius:10px;padding:10px 8px;background:var(--accent);color:var(--on-accent);cursor:pointer;touch-action:manipulation}
.btn.alt{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
.btn.sell{background:var(--good);color:var(--on-accent)}
.btn.danger{background:var(--bad);color:var(--on-accent)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.38;cursor:default}
.btn:focus-visible,.tab:focus-visible,.gear:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.wide{width:100%;font-size:15px;padding:12px}
.btn small{display:block;font:500 12px var(--mono);opacity:.9}
.seg{display:flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:none;font:800 13px var(--body);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lv{font:400 22px/1 var(--display);color:var(--accent);min-width:42px;text-align:center}
.bar2{height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold);width:0}
.bar2.good i{background:var(--good)} .bar2.mid i{background:var(--warn)} .bar2.bad i{background:var(--bad)}
.staff{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.emp{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--chip)}
.emp .who{min-width:0;flex:1;font-size:13.5px}
.emp .who b{font-weight:900}
.emp .who small{display:block;color:var(--muted);font:500 11.5px var(--mono)}
.emp .act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.locked{opacity:.55;border-style:dashed}
.goal{flex-direction:row;align-items:center}
.goal .chk{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--chip);border:2px solid var(--line);font-weight:900;color:var(--on-accent)}
.goal.done .chk{background:var(--good);border-color:var(--good)}
.help{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.help ol{margin:6px 0 8px;padding-left:20px}
.help li{margin:3px 0}
.tick{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--muted)}
.tick .bar2{flex:1}
.need{display:grid;grid-template-columns:82px 1fr 48px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.need span:last-child{font:500 12px var(--mono);text-align:right}
.big{margin-left:auto;font:400 28px/1 var(--display)}
.fin{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.fin span:nth-child(even){font:500 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.fin .tot{font-weight:900;border-top:1px solid var(--line);padding-top:4px}
canvas.chart{width:100%;height:130px;display:block}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:6px 10px;font-size:14px;align-items:center}
.lb .me{color:var(--accent);font-weight:900}
.set{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.set label{font-weight:800}
.set input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
textarea.code{width:100%;font:500 12px/1.35 var(--mono);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:vertical;word-break:break-all}
.her{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;color:var(--muted);font:800 11.5px var(--body);padding:9px 0 11px;cursor:pointer;position:relative;min-width:0}
.tab .ic{display:block;font-size:18px;line-height:1.2}
.tab.on{color:var(--accent)}
.tab .dot{position:absolute;top:7px;right:24%;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tab .dot.red{background:var(--bad)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);opacity:0;transition:.25s;z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <button class="gear" id="gear" aria-label="Paramètres">⚙︎</button>
  <div class="logo">Petit Empire<small id="cityName">Petit-Bourg</small></div>
  <div class="cash"><b id="cash">50 €</b><small id="rate">0 €/s · Jour 1</small></div>
</div></header>

<div class="townbox" id="townbox"><div class="townwrap" id="townwrap"><canvas id="town" aria-label="Ta ville : touche un bâtiment pour voir ses chiffres"></canvas></div><button class="viewbtn" id="viewBtn">▦ Plan</button></div>
<div class="planinfo wrap" id="planInfo" hidden></div>
<div class="news wrap"><span class="tag" id="newsTag">Jour 1</span><span id="newsTxt">Bienvenue ! Ouvre ton premier stand de crêpes ou achète du blé quand il est bas.</span></div>
<div class="wrap" id="banner"></div>
<div class="wrap" id="todo"></div>

<main class="wrap" id="main"></main>

<nav class="tabs" id="tabs">
  <button class="tab on" data-tab="market"><span class="ic">⚖︎</span>Marché<span class="dot" id="mdot" hidden></span></button>
  <button class="tab" data-tab="biz"><span class="ic">⌂</span>Commerces<span class="dot red" id="bdot" hidden></span></button>
  <button class="tab" data-tab="city"><span class="ic">♣︎</span>Ville<span class="dot red" id="cdot" hidden></span></button>
  <button class="tab" data-tab="upg"><span class="ic">⚒︎</span>Améliorer</button>
  <button class="tab" data-tab="goals"><span class="ic">★</span>Objectifs<span class="dot" id="gdot" hidden></span></button>
</nav>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ======================================================================
   PETIT EMPIRE — données
   ====================================================================== */
const VERSION='2.1';
const MT=15;          // la bourse change toutes les 15 s
const DAY=180;        // un jour de jeu = 3 minutes
const SEASON_DAYS=7;  // une saison = 7 jours
const GOODS=[
 {id:'ble',name:'Blé',unit:'sac',base:12,vol:.09,unlock:0},
 {id:'cafe',name:'Café',unit:'kg',base:60,vol:.1,unlock:600},
 {id:'soie',name:'Soie',unit:'rouleau',base:260,vol:.11,unlock:8000},
 {id:'cuivre',name:'Cuivre',unit:'lingot',base:1200,vol:.09,unlock:9e4},
 {id:'safran',name:'Safran',unit:'boîte',base:6500,vol:.13,unlock:8e5},
 {id:'or',name:'Or',unit:'once',base:34000,vol:.08,unlock:8e6},
 {id:'parfum',name:'Parfum rare',unit:'flacon',base:1.6e5,vol:.11,unlock:7e7},
 {id:'diamant',name:'Diamant',unit:'pierre',base:9e5,vol:.1,unlock:6e8},
 {id:'puce',name:'Puces électroniques',unit:'caisse',base:5e6,vol:.14,unlock:5e9},
];
const BIZ=[
 {id:'crepe',name:'Stand de crêpes',cost:15,rate:.4,col:'#e9845a',job:'crêpier',part:'La plaque chauffante'},
 {id:'kiosque',name:'Kiosque à journaux',cost:120,rate:2.5,col:'#5aa3c9',job:'vendeur',part:'Le présentoir'},
 {id:'boul',name:'Boulangerie',cost:1100,rate:14,col:'#d9a441',job:'boulanger',part:'Le four'},
 {id:'brasserie',name:'Brasserie',cost:12000,rate:90,col:'#b85a6a',job:'serveur',part:'La tireuse à bière'},
 {id:'cinema',name:'Cinéma',cost:55000,rate:280,col:'#c46aa0',job:'projectionniste',part:'Le projecteur'},
 {id:'atelier',name:'Atelier textile',cost:1.3e5,rate:600,col:'#7a8fd1',job:'couturier',part:'Une machine à coudre'},
 {id:'hotel',name:'Hôtel',cost:6e5,rate:2000,col:'#d98b4f',job:'réceptionniste',part:'L’ascenseur'},
 {id:'port',name:'Port marchand',cost:1.4e6,rate:4200,col:'#4f9e8a',job:'docker',part:'Une grue'},
 {id:'centre',name:'Centre commercial',cost:7e6,rate:13000,col:'#5f8fb0',job:'vendeur',part:'Les escalators'},
 {id:'banque',name:'Banque',cost:2e7,rate:32000,col:'#c9b78f',job:'guichetier',part:'Le distributeur'},
 {id:'bourse',name:'Bourse',cost:3e8,rate:2.6e5,col:'#8e6fb3',job:'trader',part:'Les serveurs informatiques'},
 {id:'aeroport',name:'Aéroport',cost:1.6e9,rate:9e5,col:'#7f9aa6',job:'agent',part:'Le tapis à bagages'},
 {id:'tour',name:'Tour Empire',cost:5e9,rate:2.4e6,col:'#6c7f8c',job:'gardien',part:'La climatisation'},
];
const NEEDS=[{id:'hyg',name:'Hygiène'},{id:'sec',name:'Sécurité'},{id:'conf',name:'Confort'},{id:'trans',name:'Transport'}];
const INFRA=[
 {id:'poubelle',name:'Poubelles',need:'hyg',cap:25,cost:40,maint:.03,max:8,brk:'Une poubelle déborde'},
 {id:'wc',name:'Toilettes publiques',need:'hyg',cap:70,cost:250,maint:.15,max:5,brk:'Des toilettes sont bouchées'},
 {id:'nettoyage',name:'Service de nettoyage',need:'hyg',cap:900,cost:1.2e5,maint:12,max:3,brk:'Une balayeuse est en panne'},
 {id:'hopital',name:'Hôpital',need:'hyg',cap:12000,cost:6e7,maint:2500,max:2,brk:'Le scanner de l’hôpital est en panne'},
 {id:'lampe',name:'Lampadaires',need:'sec',cap:35,cost:90,maint:.06,max:8,brk:'Un lampadaire a grillé'},
 {id:'camera',name:'Caméras',need:'sec',cap:250,cost:8000,maint:1.2,max:4,brk:'Une caméra ne filme plus'},
 {id:'police',name:'Commissariat',need:'sec',cap:2500,cost:2.5e6,maint:180,max:2,brk:'La voiture de police est en panne'},
 {id:'banc',name:'Bancs',need:'conf',cap:20,cost:30,maint:.02,max:8,brk:'Un banc est cassé'},
 {id:'fontaine',name:'Fontaine',need:'conf',cap:160,cost:3500,maint:.8,max:3,brk:'La pompe de la fontaine fuit'},
 {id:'parc',name:'Parc',need:'conf',cap:1200,cost:3e5,maint:30,max:4,brk:'L’arrosage du parc est en panne'},
 {id:'stade',name:'Stade',need:'conf',cap:15000,cost:1.5e8,maint:6000,max:1,brk:'Les projecteurs du stade sont grillés'},
 {id:'bus',name:'Arrêt de bus',need:'trans',cap:60,cost:400,maint:.3,max:4,brk:'Un bus est en panne'},
 {id:'parking',name:'Parking',need:'trans',cap:500,cost:4e4,maint:6,max:3,brk:'La barrière du parking est bloquée'},
 {id:'metro',name:'Station de métro',need:'trans',cap:6000,cost:1.2e7,maint:900,max:2,brk:'Un escalator du métro est en panne'},
];
const MILES=[10,25,50,100,150,200,300,400];
const cap=l=>20*2**l, fee=l=>[4,3,2,1][l];
const TAX=[10,8,6,4];
const OFF_FRAC=[.1,.3,.6,1], OFF_H=[1,3,6,10];
const UPG=[
 {id:'entrepot',name:'Entrepôt',max:12,cost:l=>150*5**l,desc:l=>`Capacité ${fmt(cap(l))} → ${fmt(cap(l+1))} unités`},
 {id:'flair',name:'Flair du marché',max:1,cost:()=>2500,desc:()=>'Montre la tendance et si le prix est bas ou haut'},
 {id:'nego',name:'Négociateur',max:3,cost:l=>[800,25000,6e5][l],desc:l=>`Commission ${fee(l)} % → ${fee(l+1)} %`},
 {id:'marketing',name:'Campagne publicitaire',max:12,cost:l=>3000*11**l,desc:()=>'Revenus des commerces ×1,5 (salaires aussi)'},
 {id:'formation',name:'Formation du personnel',max:5,cost:l=>4000*9**l,desc:()=>'Employés 20 % plus efficaces'},
 {id:'rh',name:'Service RH',max:3,cost:l=>[6000,4e5,3e7][l],desc:()=>'Les employés perdent leur bonne humeur 25 % moins vite'},
 {id:'preventif',name:'Entretien préventif',max:4,cost:l=>2000*12**l,desc:()=>'20 % de pannes en moins'},
 {id:'outils',name:'Outils de pro',max:3,cost:l=>[3000,2e5,2e7][l],desc:()=>'Réparations 50 % plus rapides'},

const SUF=['','k','M','Md','Bn','Bd','Tn','Td','Qn'];
function fmt(n){
  if(!isFinite(n))return '∞';
  const neg=n<0;n=Math.abs(n);let s;
  if(n<1000) s=Number.isInteger(n)?String(n):n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString();
  else if(n<1e6||(SET.longNum&&n<1e18)) s=Math.floor(n).toLocaleString('fr-FR');
  else{let i=Math.min(Math.floor(Math.log10(n)/3),SUF.length-1);const v=n/10**(i*3);s=v.toFixed(v<10?2:v<100?1:0)+' '+SUF[i]}
  return (neg?'−':'')+s.replace('.',',');
}

/* ---------- Son et musique (synthétisés, aucun fichier) ---------- */
let AC=null,sfxG=null,musG=null,musNext=0,musStep=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  sfxG=AC.createGain();musG=AC.createGain();sfxG.connect(AC.destination);musG.connect(AC.destination);applyVol();
}
function applyVol(){if(!AC)return;sfxG.gain.value=SET.sfx*.5;musG.gain.value=SET.musicOn?SET.music*.22:0}
function tone(f,t0,d,type='triangle',v=.5,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(sfxG);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){
  if(!AC||SET.sfx<=0||document.hidden)return;const t=AC.currentTime;
  if(k==='coin'){tone(988,t,.08,'square',.25);tone(1319,t+.07,.22,'square',.25)}
  else if(k==='buy'){tone(523,t,.09,'triangle',.4)}
  else if(k==='sell'){tone(659,t,.08,'triangle',.4);tone(988,t+.07,.16,'triangle',.4)}
  else if(k==='bad'){tone(220,t,.3,'sawtooth',.2,140)}
  else if(k==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.18,'triangle',.35))}
  else if(k==='alert'){tone(440,t,.12,'square',.2);tone(440,t+.18,.12,'square',.2)}

function migrate(s){

  if(!s.cities){const v=newCity('village',f.clock);for(const k of CITY_KEYS)if(s[k]!=null)v[k]=s[k];f.cities={village:v};f.city='village'}
  for(const k of CITY_KEYS)delete f[k];
  for(const id of Object.keys(f.cities)){
    const c=Object.assign(newCity(id,f.clock),f.cities[id]);f.cities[id]=c;
    for(const k of['staff','infra','biz','rivals','craft','craftAcc','buffs','adj'])if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k]))c[k]={};
    for(const sid in c.staff){const v=c.staff[sid];if(typeof v==='number')c.staff[sid]=Array.from({length:v},newEmp);else if(!Array.isArray(v))c.staff[sid]=[]}
    if(!Array.isArray(c.broken))c.broken=[];
    if(!Array.isArray(c.grid)||c.grid.length!==GRID)c.grid=Array(GRID).fill(null);
  }
  if(!f.cities[f.city])f.city='village';
  f.travel=null;
  f.cnt=Object.assign(fresh().cnt,f.cnt||{});
  if(!f.streak)f.streak={last:'',n:0};

  for(const k of['contracts','hist'])if(!Array.isArray(f[k]))f[k]=[];
  if(f.dayIdx==null)f.dayIdx=Math.floor(f.clock/DAY);
  if(!(f.mTimer>0))f.mTimer=MT;
  if(!f.elect)f.elect={next:f.dayIdx+10,cands:null,pick:null,don:0};
  if(!WEATHER[f.weather])f.weather='soleil';
  return f;
}
function stepGood(g,st){
  const tgt=S?(SEASONS[season()].good[g.id]||0):0;
  st.x+=-.06*(st.x-tgt)+(st.dt>0?st.drift:0)+randn()*g.vol;
  if(st.dt>0)st.dt--;
  st.x=Math.max(-1.25,Math.min(1.25,st.x));
  st.hist.push(g.base*Math.exp(st.x)); if(st.hist.length>48)st.hist.shift();
}

function drawChart(){
  const c=$('fchart');if(!c)return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=130;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const d=S.hist,vals=d.map(p=>p.cash),mn=Math.min(0,...vals),mx=Math.max(...vals,1),pad=8,r=mx-mn||1;
  const X=i=>pad+i/(d.length-1)*(w-pad*2),Y=v=>h-18-(v-mn)/r*(h-34);
  x.strokeStyle=T.ink;x.globalAlpha=.12;x.lineWidth=1;for(let k=0;k<=2;k++){const yy=Y(mn+r*k/2);x.beginPath();x.moveTo(pad,yy);x.lineTo(w-pad,yy);x.stroke()}x.globalAlpha=1;
  if(mn<0){x.strokeStyle=T.bad;x.globalAlpha=.6;x.beginPath();x.moveTo(pad,Y(0));x.lineTo(w-pad,Y(0));x.stroke();x.globalAlpha=1}
  x.beginPath();d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.cash)):x.moveTo(X(i),Y(p.cash)));x.strokeStyle=T.gold;x.lineWidth=2.2;x.stroke();
  x.lineTo(X(d.length-1),Y(mn));x.lineTo(X(0),Y(mn));x.closePath();x.globalAlpha=.15;x.fillStyle=T.gold;x.fill();x.globalAlpha=1;
  const li=d.length-1;x.beginPath();x.arc(X(li),Y(d[li].cash),3.5,0,7);x.fillStyle=T.gold;x.fill();
  x.fillStyle=T.ink;x.globalAlpha=.7;x.font='500 10px "DM Mono",monospace';x.textAlign='left';x.fillText('max '+eur(mx),pad,10);x.textAlign='center';
  d.forEach((p,i)=>{if(i%Math.ceil(d.length/6)===0||i===li)x.fillText('J'+p.day,Math.min(w-14,Math.max(14,X(i))),h-4)});x.globalAlpha=1;
}

/* ======================================================================
   Plan de la ville (grille 6×6) et voisinage
   ====================================================================== */
const ORDER=[...Array(GRID).keys()].sort((a,b)=>{const d=i=>Math.hypot(i%GW-2.5,Math.floor(i/GW)-2.5);return d(a)-d(b)||a-b});
const NOISY=['atelier','port','aeroport'],CALM=['hotel','cinema','brasserie','banque','boul'],SHOPS=['crepe','kiosque','boul'];
const NEED_ADJ={conf:.08,trans:.06,hyg:.03,sec:.03};
const SHORT={crepe:'Crêpes',kiosque:'Kiosque',boul:'Boulang.',brasserie:'Brasserie',cinema:'Cinéma',atelier:'Atelier',hotel:'Hôtel',port:'Port',centre:'Centre',banque:'Banque',bourse:'Bourse',aeroport:'Aéroport',tour:'Tour'};
const itemKey=it=>it?it.t+':'+it.id:'';
function ensureGrid(){
  if(!C)return;const g=C.grid,want=new Set();
  BIZ.forEach(b=>{if(lvl(b.id))want.add('b:'+b.id)});INFRA.forEach(i=>{if(cnt(i.id))want.add('i:'+i.id)});
  const have=new Set();
  for(let k=0;k<GRID;k++){const key=itemKey(g[k]);if(!key)continue;if(!want.has(key)||have.has(key))g[k]=null;else have.add(key)}
  for(const key of want){if(have.has(key))continue;const k=ORDER.find(i=>!g[i]);if(k==null)break;const [t,id]=key.split(':');g[k]={t,id}}
  computeAdj();
}
function neigh(k){const r=[],x=k%GW,y=Math.floor(k/GW);if(x>0)r.push(k-1);if(x<GW-1)r.push(k+1);if(y>0)r.push(k-GW);if(y<GW-1)r.push(k+GW);return r}
function computeAdj(){
  const g=C.grid;C.adj={};
  for(let k=0;k<GRID;k++){const it=g[k];if(!it||it.t!=='b')continue;const self=it.id;let m=1;const parts={};
    const add=(lab,v)=>{m+=v;parts[lab]=(parts[lab]||0)+v};
    for(const n of neigh(k)){const nb=g[n];if(!nb)continue;
      if(nb.t==='i'){const I=INFRA.find(x=>x.id===nb.id);add(I.name,NEED_ADJ[I.need]||0)}
      else{
        if(NOISY.includes(nb.id)&&CALM.includes(self))add('Bruit : '+BIZ.find(x=>x.id===nb.id).name.toLowerCase(),-.12);
        if(nb.id==='centre'&&SHOPS.includes(self))add('Centre commercial',.1);
        if(self==='hotel'&&(nb.id==='brasserie'||nb.id==='cinema'))add(BIZ.find(x=>x.id===nb.id).name,.06);
        if((self==='banque'&&nb.id==='bourse')||(self==='bourse'&&nb.id==='banque'))add(BIZ.find(x=>x.id===nb.id).name,.1);
      }}
    C.adj[self]={m:Math.max(.6,Math.min(1.6,m)),parts};
  }
}
const adjOf=id=>(C&&C.adj&&C.adj[id])?C.adj[id].m:1;
let planSel=null,planTxt='';
function planTap(x,y){
  const d=planDims(),col=Math.floor((x-d.ox)/d.cs),row=Math.floor((y-d.oy)/d.cs);
  if(col<0||col>=GW||row<0||row>=GW)return;const k=row*GW+col,g=C.grid;
  if(planSel==null){if(g[k]){planSel=k;sfx('tick')}else toast('Case libre : choisis d’abord un bâtiment.')}
  else if(k===planSel)planSel=null;
  else{const a=g[planSel];g[planSel]=g[k];g[k]=a;S.cnt.moves++;computeAdj();planSel=null;sfx('buy');
    if(a&&a.t==='b'){const m=adjOf(a.id);toast(`${BIZ.find(b=>b.id===a.id).name} déplacé : voisins ${m>=1?'+':'−'}${Math.round(Math.abs(m-1)*100)} %`)}
    if(tab==='biz')build('biz')}
  updPlanInfo(true);
}
function itemName(it){return it.t==='b'?BIZ.find(b=>b.id===it.id).name:INFRA.find(i=>i.id===it.id).name}
function updPlanInfo(force){
  const el=$('planInfo');if(!el||el.hidden||!S)return;
  let h;const it=planSel!=null?C.grid[planSel]:null;
  if(it){
    if(it.t==='b'){const a=C.adj[it.id]||{m:1,parts:{}},ps=Object.entries(a.parts);
      h=`<b>${itemName(it)}</b> · voisinage <b class="${a.m>=1?'up':'down'}">${a.m>=1?'+':'−'}${Math.round(Math.abs(a.m-1)*100)} %</b>${ps.length?' : '+ps.map(([l,v])=>`${l} ${v>0?'+':'−'}${Math.round(Math.abs(v)*100)} %`).join(', '):''}. Touche une autre case pour le déplacer.`}
    else h=`<b>${itemName(it)}</b> : donne un bonus aux commerces juste à côté (${Math.round((NEED_ADJ[INFRA.find(i=>i.id===it.id).need]||0)*100)} % chacun). Touche une autre case pour le déplacer.`;
  }else h=`Touche un bâtiment, puis une case, pour le déplacer. Bancs, fontaines et parcs à côté d’un commerce : +8 %. Transports : +6 %. L’atelier, le port et l’aéroport font du bruit : −12 % pour l’hôtel, le cinéma, la brasserie, la banque et la boulangerie. Le centre commercial aide les petits commerces voisins.`;
  if(h!==planTxt||force){planTxt=h;el.innerHTML=h}
}
function drawPlan(){
  const d=planDims(),cs=d.cs,se=season();
  cx.fillStyle=se===3?'#dfe6ea':T.ground;cx.fillRect(0,0,CW,CH);
  cx.fillStyle='rgba(120,110,90,.35)';cx.fillRect(d.ox-3,d.oy-3,cs*GW+6,cs*GW+6);

      cx.fillStyle='rgba(255,255,255,.55)';for(let wy=y+s*.34;wy<y+s*.62;wy+=7)for(let wx=x+5;wx<x+s-6;wx+=7)cx.fillRect(wx,wy,3,3.5);
      cx.fillStyle='#fff';cx.font=`900 ${Math.max(8,Math.round(cs*.17))}px Nunito,sans-serif`;cx.fillText(SHORT[b.id],x+s/2,y+s*.13);
      cx.font=`400 ${Math.round(cs*.26)}px "Bagel Fat One",sans-serif`;cx.textAlign='left';cx.fillText(lvl(b.id),x+4,y+s*.82);cx.textAlign='center';
      const m=adjOf(b.id);if(Math.abs(m-1)>.005){const t=(m>1?'+':'−')+Math.round(Math.abs(m-1)*100)+'%';cx.font=`800 ${Math.max(8,Math.round(cs*.16))}px Nunito,sans-serif`;const tw=cx.measureText(t).width+6;cx.fillStyle=m>1?'#1f8456':'#c03b32';cx.fillRect(x+s-tw-2,y+s*.7,tw,cs*.22);cx.fillStyle='#fff';cx.fillText(t,x+s-tw/2-2,y+s*.7+cs*.11)}
      const list=C.staff[b.id]||[];if(brk||list.some(e=>e.ask||e.strike)){cx.beginPath();cx.arc(x+s-5,y+5,4.5,0,7);cx.fillStyle=brk?'#e53935':'#f2b53a';cx.fill()}
    }else{const I=INFRA.find(q=>q.id===it.id);
      cx.fillStyle='#e8eee9';cx.fillRect(x,y,s,s);{const sc=cs/24;cx.save();cx.translate(x+s/2,y+s*.84);cx.scale(sc,sc);drawInfra(I.id,0,0,[],!!brk);cx.restore()}
      cx.fillStyle='#2b3a40';cx.font=`800 ${Math.max(8,Math.round(cs*.16))}px Nunito,sans-serif`;cx.textAlign='left';cx.fillText('×'+cnt(I.id),x+4,y+s*.14);cx.textAlign='center';

    if(k===planSel){cx.strokeStyle='#f2b53a';cx.lineWidth=3.5;cx.strokeRect(x-1,y-1,s+2,s+2)}
  }
  if(planSel!=null){cx.strokeStyle='rgba(242,181,58,.7)';cx.lineWidth=1.5;cx.setLineDash([4,3]);for(const n of neigh(planSel)){const x=d.ox+(n%GW)*cs+3,y=d.oy+Math.floor(n/GW)*cs+3;cx.strokeRect(x,y,cs-6,cs-6)}cx.setLineDash([])}
}

  for(const n of NEEDS){const v=needSat(n.id);if(v>=.7||visitors()<30)continue;
    const opts=visibleInfra().filter(i=>i.need===n.id).sort((a,b)=>infraCost(a)-infraCost(b));const best=opts.filter(i=>infraCost(i)<=S.cash).pop()||opts[0];
    L.push({k:'n'+n.id,hot:v<.5,t:`${n.name} insuffisante (${pct(v)})`,s:best?`${best.name} : +${fmt(best.cap)} visiteurs`:'Va voir les équipements',b:best?[['sm','infra',{i:best.id},'Installer',infraCost(best)]]:[['alt sm','go',{t:'city'},'Ville',null]]})}

function travelTo(id){

}
function foundCity(id){
  const cd=CITY(id);if(S.cities[id])return;
  if(S.run.earned<cd.cost*.4)return toast(`Gagne d’abord ${eur(cd.cost*.4)} dans la partie.`);

let lastWall=Date.now(),logicAcc=0,drawAcc=0,uiAcc=0,saveAcc=0,gAcc=0,cloudAcc=0,dailyAcc=0,townVisible=true;
try{new IntersectionObserver(es=>{townVisible=es[0].isIntersecting}).observe($('townbox'))}catch(e){}
function step(dt){
  MEMO={};
  S.clock+=dt;
  if(S.boost.m!==1&&S.clock>S.boost.until)S.boost={m:1,until:0};
  if(S.crisis&&S.clock>S.crisis.until){setNews('Crise',`${CRISES[S.crisis.id].n} : c’est terminé.`);S.crisis=null}
  if(S.special&&S.clock>S.special.until){setNews('Visite',`${SPECIALS[S.special.id].n} est reparti${S.special.id==='star'?'e':''}.`);S.special=null}
  if(S.travel&&S.clock>=S.travel.until)arrive();
  let gross=0,sal=0,mt=0;
  forCities(()=>{calcPM();gross+=grossIncome();sal+=salaries()+techPay();mt+=maintenance();
    if(S.clock>=C.nextBreak)spawnBreak();tickRepairs(dt);tickCraft(dt)});
  C=activeC();calcPM();
  const it=interest();GROSS_ALL=gross;COSTS_ALL=sal+mt+it;
  earn(gross*dt);S.cash-=COSTS_ALL*dt;
  const ds=S.dayStats;ds.gross+=gross*dt;ds.sal+=sal*dt;ds.maint+=mt*dt;ds.int+=it*dt;
  if(S.cash<0&&!S.inDebt){S.inDebt=true;setNews('Alerte','Tu es dans le rouge ! Tes commerces tournent à 70 %. Licencie, retire des équipements ou vends du stock.');sfx('alert');vib([60,40,60])}
  else if(S.cash>=0&&S.inDebt)S.inDebt=false;
  S.mTimer-=dt;
  if(S.mTimer<=0){S.mTimer=MT;GOODS.forEach(g=>stepGood(g,S.goods[g.id]));if(tab==='market'){drawSparks();sfx('tick')}}
  if(Math.floor(S.clock/DAY)>S.dayIdx)endDay();
  if(S.clock>=S.nextNews)fireNews();
  if(!op&&S.clock>=S.nextOp)spawnOp();
  if(S.contracts.length<3&&S.clock>=S.nextContract&&S.run.earned>=30)genContract();
  if(S.contracts.some(c=>S.clock>c.until)){const lost=S.contracts.filter(c=>S.clock>c.until);S.contracts=S.contracts.filter(c=>S.clock<=c.until);toast(`Commande annulée : ${lost[0].who} n’a pas été livré à temps`)}
  if(!S.crisis&&S.clock>=S.nextCrisis&&S.run.earned>=2e4)startCrisis();
  if(!S.special&&S.clock>=S.nextSpecial)startSpecial();
  gAcc+=dt;if(gAcc>=1){const g=gAcc;gAcc=0;forCities(()=>{calcPM();tickEmployees(g);ensureGrid()});C=activeC();MEMO={};calcPM();checkGoals()}
  uiAcc+=dt;if(uiAcc>=.25){uiAcc=0;refresh();musicTick()}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}
  cloudAcc+=dt;if(cloudAcc>60){cloudAcc=0;if(SET.cloudAuto)pushCloud(true)}
  dailyAcc+=dt;if(dailyAcc>60){dailyAcc=0;checkDaily()}
}
function frame(){
  const now=Date.now();let dt=(now-lastWall)/1000;lastWall=now;
  if(dt>5){applyOffline(dt);build(tab);dt=0}
  dt=Math.min(dt,.5);
  logicAcc+=dt;if(logicAcc>=.1){step(Math.min(logicAcc,.5));logicAcc=0}
  drawAcc+=dt;
  if(townVisible&&drawAcc>=(lowAnim()?.066:.033)){draw(Math.min(drawAcc,.2));drawAcc=0}
  requestAnimationFrame(frame);
}
function start(){
  const had=load();
  if(had&&S.t)applyOffline((Date.now()-S.t)/1000);
  if(!S.elect.cands)newElection();
  forCities(()=>ensureGrid());C=activeC();
  applyTheme();sizeCanvas();checkDaily();
  GROSS_ALL=allGross();COSTS_ALL=allCosts();build(tab);
  lastWall=Date.now();requestAnimationFrame(frame);
}
addEventListener('resize',sizeCanvas);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(SET.cloudAuto)pushCloud(true);if(AC)AC.suspend()}else if(AC)AC.resume()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTokens();drawSparks()})}catch(e){}
start();
initCloud();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
