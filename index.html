<style>
/* Layout: one-screen phone game — sticky cash bar, a living 2D town, news strip, event banners, scrolling panel, fixed bottom tabs */
:root{
  --bg:#e7f0ec; --panel:#ffffff; --ink:#1b2932; --muted:#566a74; --line:#d0dedd; --chip:#eef5f2;
  --sky:#bfe0ef; --night:#1f3354; --ground:#8dbd86;
  --accent:#d4512a; --on-accent:#ffffff; --gold:#e09d14; --good:#1f8456; --bad:#c03b32; --warn:#c77a0a;
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --panel:#16232a; --ink:#e5eef0; --muted:#93a8b1; --line:#283a43; --chip:#1d2d35;
  --sky:#3d6f8f; --night:#0b1529; --ground:#3f6b45;
  --accent:#f07a4c; --on-accent:#1d0d05; --gold:#f2b53a; --good:#4cc487; --bad:#f06c62; --warn:#f0a440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e171c; --panel:#16232a; --ink:#e5eef0; --muted:#93a8b1; --line:#283a43; --chip:#1d2d35;
  --sky:#3d6f8f; --night:#0b1529; --ground:#3f6b45;
  --accent:#f07a4c; --on-accent:#1d0d05; --gold:#f2b53a; --good:#4cc487; --bad:#f06c62; --warn:#f0a440; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
svg{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 6px 18px -14px rgba(10,30,50,.5)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.gear{border:1px solid var(--line);background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:13px;cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .12s}
.gear svg{width:21px;height:21px}
.gear:active{transform:rotate(30deg) scale(.95)}
.gear.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.logo{font:400 17px/1.05 var(--display);color:var(--accent);letter-spacing:.01em;min-width:0}
.price{min-width:0;width:100%;overflow-wrap:anywhere}.price .meta span{white-space:normal}
.btns.pr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0}.btns.pr .btn{padding:6px 2px;font-size:12px;min-width:0}
.btn small{overflow-wrap:anywhere;white-space:normal}
.logo small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.cash{margin-left:auto;text-align:right;min-width:0}
.cash b{display:block;font:400 25px/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;transition:color .3s}
.cash b.up{color:var(--good)}
.cash small{display:block;font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;margin-left:auto}
.cash b.neg{color:var(--bad)}
.townwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.townwrap::-webkit-scrollbar{display:none}
#town{display:block;height:170px;touch-action:pan-x}
.townbox{position:relative}
.viewbtn{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:8px;border:1px solid rgba(255,255,255,.25);border-radius:11px;padding:5px 10px;font:800 12px var(--body);background:rgba(10,16,30,.45);color:#fff;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.zoombtn{right:auto;left:auto;right:calc(max(8px,env(safe-area-inset-right,0px)) + 64px);min-width:34px;font-size:15px;padding:3px 10px}
.planinfo .btn{margin-left:8px}
.planinfo{padding-block:8px;font-size:13px;background:var(--chip);border-bottom:1px solid var(--line);color:var(--ink)}
.planinfo b{font-weight:900}
#todo:not(:empty){padding-top:12px}
.todo{display:flex;flex-direction:column;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px}
.todo .head{display:flex;align-items:center;gap:8px;font-weight:900}
.todo .head .sp{margin-left:auto;display:flex;gap:4px}
.todo .item{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.todo .item.hot{border-color:var(--bad)}
.todo .txt{flex:1;min-width:0;font-size:13.5px;font-weight:800}
.todo .txt small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.todo .act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.cities{display:flex;flex-wrap:wrap;gap:6px}
.gsi{display:flex;justify-content:center;min-height:0}.gsi:empty{display:none}
.cities .btn.on{outline:3px solid var(--gold)}
.news{display:flex;gap:8px;align-items:baseline;padding-block:8px;border-bottom:1px solid var(--line);background:var(--chip);font-size:13px;min-height:36px}
.news .tag{font:500 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em;flex:none;display:flex;align-items:center;gap:6px}
.news .tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,81,42,.5)}70%{box-shadow:0 0 0 6px rgba(212,81,42,0)}100%{box-shadow:0 0 0 0 rgba(212,81,42,0)}}
#banner{display:flex;flex-direction:column;gap:8px}
#banner:not(:empty){padding-top:12px}
.ev{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--bad);background:var(--panel)}
.ev.special{border-color:var(--gold)}
main{padding-block:14px 96px;display:flex;flex-direction:column;gap:10px}
h2{font:400 21px/1.1 var(--display);margin:8px 0 0;text-wrap:balance;letter-spacing:.005em}
h3{font:800 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.sub{color:var(--muted);font-size:13px;margin:0}
.row{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 10px 22px -18px rgba(15,40,60,.45)}
.row.alert{border-color:var(--bad)}
.row.gold{border-color:var(--gold)}
.top{display:flex;align-items:center;gap:10px}
.name{font-weight:900;font-size:16px;min-width:0}
.name small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.price{margin-left:auto;text-align:right;font:500 16px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{display:block;font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)} .mut{color:var(--muted)} .warn{color:var(--warn)}
canvas.spark{width:88px;height:32px;flex:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:800}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--chip);font:500 11.5px var(--mono);color:var(--ink);white-space:nowrap}
.pill.bad{background:var(--bad);color:var(--on-accent)}
.pill.gold{background:var(--gold);color:#2a1a00}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btns.two{grid-template-columns:1fr 1fr}
.btns.three{grid-template-columns:1fr 1fr 1fr}
.btns.one{grid-template-columns:1fr}
.btn{font:800 14px var(--body);border:0;border-radius:12px;padding:10px 8px;background:var(--accent);color:var(--on-accent);cursor:pointer;touch-action:manipulation;box-shadow:inset 0 -2.5px 0 rgba(0,0,0,.17),0 1px 2px rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:active:not(:disabled){transform:translateY(1.5px) scale(.985);box-shadow:inset 0 -1px 0 rgba(0,0,0,.17)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn.alt{background:var(--chip);color:var(--ink);border:1px solid var(--line);box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.btn.sell{background:var(--good);color:var(--on-accent)}
.btn.danger{background:var(--bad);color:var(--on-accent)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.38;cursor:default;box-shadow:none}
.btn:focus-visible,.tab:focus-visible,.gear:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.wide{width:100%;font-size:15px;padding:12px}
.btn small{display:block;font:500 12px var(--mono);opacity:.9}
.seg{display:flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:none;font:800 13px var(--body);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.lv{font:400 22px/1 var(--display);color:var(--accent);min-width:42px;text-align:center}
.bar2{height:6px;border-radius:9px;background:var(--chip);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--gold);width:0}
.bar2.good i{background:var(--good)} .bar2.mid i{background:var(--warn)} .bar2.bad i{background:var(--bad)}
.staff{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.emp{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--chip)}
.emp .who{min-width:0;flex:1;font-size:13.5px}
.emp .who b{font-weight:900}
.emp .who small{display:block;color:var(--muted);font:500 11.5px var(--mono)}
.emp .act{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.locked{opacity:.55;border-style:dashed}
.goal{flex-direction:row;align-items:center}
.goal .chk{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--chip);border:2px solid var(--line);font-weight:900;color:var(--on-accent)}
.goal.done .chk{background:var(--good);border-color:var(--good)}
.help{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.help ol{margin:6px 0 8px;padding-left:20px}
.help li{margin:3px 0}
.tick{display:flex;align-items:center;gap:10px;font:500 12px var(--mono);color:var(--muted)}
.tick .bar2{flex:1}
.need{display:grid;grid-template-columns:82px 1fr 48px;align-items:center;gap:8px;font-size:13px;font-weight:700}
.need span:last-child{font:500 12px var(--mono);text-align:right}
.big{margin-left:auto;font:400 28px/1 var(--display)}
.fin{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.fin span:nth-child(even){font:500 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.fin .tot{font-weight:900;border-top:1px solid var(--line);padding-top:4px}
canvas.chart{width:100%;height:130px;display:block}
.lb{display:grid;grid-template-columns:28px 1fr auto;gap:6px 10px;font-size:14px;align-items:center}
.lb .me{color:var(--accent);font-weight:900}
.set{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.set label{font-weight:800}
.set input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
textarea.code{width:100%;font:500 12px/1.35 var(--mono);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;resize:vertical;word-break:break-all}
.her{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 22px -18px rgba(10,30,50,.5);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tab{border:0;background:none;color:var(--muted);font:800 11.5px var(--body);padding:9px 0 11px;cursor:pointer;position:relative;min-width:0}
.tab .ic{display:block;line-height:0;margin-bottom:3px}
.tab .ic svg{width:23px;height:23px;transition:transform .15s}
.tab.on{color:var(--accent)}
.tab.on .ic svg{transform:translateY(-1px) scale(1.08);fill:rgba(212,81,42,.14)}
.tab.on::before{content:"";position:absolute;top:0;left:32%;right:32%;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.tab .dot{position:absolute;top:7px;right:24%;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.tab .dot.red{background:var(--bad)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px) scale(.96);opacity:0;transition:transform .3s cubic-bezier(.2,1.4,.4,1),opacity .2s;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:800;font-size:14px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.btn.sm{padding:9px 12px;min-height:38px;font-size:13.5px}
details.sec{background:transparent;border:0}
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font:400 19px/1.1 var(--display);padding:8px 2px;margin-top:4px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:6px}
details.sec[open]>summary::after{transform:rotate(-135deg)}
details.sec>.body{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.tipbar{display:flex;align-items:center;gap:10px;padding-block:9px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.tipbar .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--gold);font-weight:900}
.tipbar .tx{flex:1;min-width:0}
.todo .item{padding:6px 8px}
.todo .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .txt small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{padding:10px 12px;gap:6px}
.btns.trade{grid-template-columns:1fr 1fr 1.15fr 1.1fr 1.4fr;column-gap:5px}
.btns.trade .btn{padding:10px 2px;font-size:13.5px}
.btns.trade .sell{margin-left:8px}
[data-tip]{cursor:help;text-decoration:underline dotted rgba(127,127,127,.6);text-underline-offset:3px}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--gold)}30%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.flash{animation:flash .7s ease-out}
.goalsdone .row{opacity:.75}
/* Styles d'interface (après les thèmes pour passer devant) */
html:root[data-skin="nuit"]{--bg:#0b0a1f;--panel:#15132e;--ink:#eceaff;--muted:#9b97c9;--line:#2a2752;--chip:#1d1a3d;--sky:#2b2a6b;--night:#07061a;--ground:#1d3b4a;--accent:#ff4fd8;--on-accent:#1a0420;--gold:#3ef0ff;--good:#3cf2a3;--bad:#ff5c7a;--warn:#ffcf4a;color-scheme:dark}
html:root[data-skin="pastel"]{--bg:#fbf3f6;--panel:#ffffff;--ink:#3b3050;--muted:#8a7f9e;--line:#ecdfe8;--chip:#f6ecf3;--sky:#cfe4ff;--night:#5a5f9e;--ground:#bfe3c8;--accent:#e97aa8;--on-accent:#ffffff;--gold:#f3b34c;--good:#3fa98a;--bad:#e05a7a;--warn:#e29a3a;color-scheme:light}
html:root[data-skin="luxe"]{--bg:#121110;--panel:#1c1a18;--ink:#f3ece0;--muted:#a89d8a;--line:#2f2b26;--chip:#24211e;--sky:#3a3a48;--night:#0c0c12;--ground:#3a4a35;--accent:#d8b45a;--on-accent:#1a1206;--gold:#f0cf7a;--good:#8fcf8a;--bad:#e2725b;--warn:#e6b85a;color-scheme:dark}
html:root[data-skin="foret"]{--bg:#eef2e6;--panel:#fbfdf6;--ink:#233024;--muted:#5f6f5c;--line:#d5dfc8;--chip:#e6eedb;--sky:#cfe7d8;--night:#1e3a2e;--ground:#8fbf7a;--accent:#3f8a4c;--on-accent:#ffffff;--gold:#c8902a;--good:#2f7d46;--bad:#b9452f;--warn:#b77b1a;color-scheme:light}
html:root[data-skin="royal"]{--bg:#140c24;--panel:#1e1435;--ink:#f1eaff;--muted:#a898c8;--line:#33275a;--chip:#271b44;--sky:#3b2a6b;--night:#0a0618;--ground:#3a2f5a;--accent:#b48cff;--on-accent:#140826;--gold:#ffd36b;--good:#7fe0a8;--bad:#ff6b8a;--warn:#ffc24a;color-scheme:dark}
html:root[data-skin="ocean"]{--bg:#eaf5fb;--panel:#ffffff;--ink:#12324a;--muted:#5d7d93;--line:#d3e6f1;--chip:#e1f0f8;--sky:#bfe3f7;--night:#163a5e;--ground:#9fd1c4;--accent:#1f7fb5;--on-accent:#ffffff;--gold:#e0a42a;--good:#1f9e8a;--bad:#d24d4d;--warn:#d68a1a;color-scheme:light}
html:root[data-skin="sakura"]{--bg:#fff4f6;--panel:#ffffff;--ink:#3d2530;--muted:#8e6f7b;--line:#f3dce3;--chip:#fbe9ee;--sky:#ffe0ea;--night:#4a2b4f;--ground:#b9d9a3;--accent:#d9467a;--on-accent:#ffffff;--gold:#d79b2c;--good:#4f9a5a;--bad:#c9384a;--warn:#cf8a2a;color-scheme:light}
html:root[data-skin="royal"] .logo{text-shadow:0 0 12px rgba(255,211,107,.35)}
html:root[data-skin="nuit"] .cash b,html:root[data-skin="nuit"] .logo{text-shadow:0 0 12px rgba(255,79,216,.45)}
html:root[data-skin="luxe"] .row{border-color:#3a342b}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.swatch{display:flex;gap:3px}.swatch i{width:14px;height:14px;border-radius:5px;display:block;border:1px solid rgba(0,0,0,.12)}
.skinrow.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

</style>
</head>

const SUF=['','k','M','Md','Bn','Bd','Tn','Td','Qn'];
function fmt(n){
  if(!isFinite(n))return '∞';
  const neg=n<0;n=Math.abs(n);let s;
  if(n<1000) s=Number.isInteger(n)?String(n):n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n).toString();
  else if(n<1e6||(SET.longNum&&n<1e18)) s=Math.floor(n).toLocaleString('fr-FR');
  else{let i=Math.min(Math.floor(Math.log10(n)/3),SUF.length-1);const v=n/10**(i*3);s=v.toFixed(v<10?2:v<100?1:0)+' '+SUF[i]}
  return (neg?'−':'')+s.replace('.',',');
}
const eur=n=>fmt(n)+' €';
const sgn=n=>(n>=0?'+':'')+eur(n);
const randn=()=>Math.sqrt(-2*Math.log(Math.random()||1e-9))*Math.cos(2*Math.PI*Math.random());
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wpick=o=>{const t=Object.values(o).reduce((a,b)=>a+b,0);let r=Math.random()*t;for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]};

/* ---------- Son et musique (synthétisés, aucun fichier) ---------- */
let AC=null,sfxG=null,musG=null,musNext=0,musStep=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  sfxG=AC.createGain();musG=AC.createGain();sfxG.connect(AC.destination);musG.connect(AC.destination);applyVol();
}
function applyVol(){if(!AC)return;sfxG.gain.value=SET.sfx*.5;musG.gain.value=SET.musicOn?SET.music*.22:0}
function tone(f,t0,d,type='triangle',v=.5,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(sfxG);o.start(t0);o.stop(t0+d+.05)}
function sfx(k){
  if(!AC||SET.sfx<=0||document.hidden)return;const t=AC.currentTime;
  if(k==='coin'){tone(988,t,.08,'square',.25);tone(1319,t+.07,.22,'square',.25)}
  else if(k==='buy'){tone(523,t,.09,'triangle',.4)}
  else if(k==='sell'){tone(659,t,.08,'triangle',.4);tone(988,t+.07,.16,'triangle',.4)}
  else if(k==='bad'){tone(220,t,.3,'sawtooth',.2,140)}
  else if(k==='level'){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.18,'triangle',.35))}
  else if(k==='alert'){tone(440,t,.12,'square',.2);tone(440,t+.18,.12,'square',.2)}
  else if(k==='tick'){tone(1200,t,.03,'sine',.12)}
}
const CHORDS=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
const PENTA=[523.3,587.3,659.3,784,880,1046.5];
function musicTick(){
  if(!AC||!SET.musicOn||SET.music<=0||document.hidden||AC.state!=='running')return;
  const now=AC.currentTime;if(musNext<now)musNext=now+.1;
  while(musNext<now+1.5){
    const ch=CHORDS[Math.floor(musStep/4)%4],t=musNext;
    if(musStep%4===0)ch.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f/2;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.6);g.gain.linearRampToValueAtTime(0,t+3.8);o.connect(g);g.connect(musG);o.start(t);o.stop(t+4)});
    if(Math.random()<.55){const o=AC.createOscillator(),g=AC.createGain(),f=pick(PENTA)*(season()===3?.84:1);o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.9);o.connect(g);g.connect(musG);o.start(t);o.stop(t+1)}
    musNext+=1;musStep++;
  }
}

function newGood(g){const st={x:(Math.random()-.5)*.5,drift:0,dt:0,inv:0,cost:0,hist:[]};for(let i=0;i<48;i++)stepGood(g,st);return st}
function newEmp(){return {id:uid(),n:pick(NAMES),t:wpick(TRAIT_W),lv:1,xp:0,worked:0,mood:75+Math.random()*20,raise:1,mgr:false,ask:false,askUntil:0,known:false,strike:false}}

    cnt:k?k.cnt:{fast:0,contracts:0,tradeProfit:0,hires:0,infra:0,ops:0,sold:0,repairs:0,crafted:0,wins:0,crisesFixed:0,dailies:0,moves:0},
    goods:{},upg:{},clock:c,bestFlip:0,sold:0,cities:{village:newCity('village',c)},city:'village',travel:null,view:'rue',isoSeen:1,todoAll:false,todoHide:false,
    nextOp:c+25,nextNews:c+20,nextContract:c+35,contracts:[],boost:{m:1,until:0},mode:1,newGoal:false,
    loan:0,dayIdx:Math.floor(c/DAY),dayStats:{gross:0,trade:0,sal:0,maint:0,int:0},lastDay:null,inDebt:false,mTimer:MT,
    weather:'soleil',crisis:null,nextCrisis:c+900,special:null,nextSpecial:c+300,hist:[],
    elect:{next:Math.floor(c/DAY)+10,cands:null,pick:null,don:0},law:null};

}
const CITY_KEYS=['stock','supply','dry','biz','staff','infra','broken','techs','nextBreak','rivals','absorbed','craft','craftAcc','buffs','open','priceWar','price'];
function migrate(s){
  const f=Object.assign(fresh(),s);
  for(const g of GOODS)if(!f.goods[g.id])f.goods[g.id]=newGood(g);
  for(const k of['upg','goals','decos'])if(!f[k]||typeof f[k]!=='object'||Array.isArray(f[k]))f[k]={};
  if(!s.cities){const v=newCity('village',f.clock);for(const k of CITY_KEYS)if(s[k]!=null)v[k]=s[k];f.cities={village:v};f.city='village'}
  for(const k of CITY_KEYS)delete f[k];
  for(const id of Object.keys(f.cities)){
    const c=Object.assign(newCity(id,f.clock),f.cities[id]);f.cities[id]=c;
    for(const k of['stock','supply','dry','staff','infra','biz','rivals','craft','craftAcc','buffs','adj','price'])if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k]))c[k]={};
    for(const sid in c.staff){const v=c.staff[sid];if(typeof v==='number')c.staff[sid]=Array.from({length:v},newEmp);else if(!Array.isArray(v))c.staff[sid]=[]}
    if(!Array.isArray(c.broken))c.broken=[];
    if(Array.isArray(c.grid)&&c.grid.length===36){const ng=Array(GRID).fill(null);c.grid.forEach((it,i)=>{if(it)ng[(Math.floor(i/6)+1)*GW+(i%6)+1]=it});c.grid=ng}
    if(!Array.isArray(c.grid)||c.grid.length!==GRID)c.grid=Array(GRID).fill(null);
  }
  if(!f.cities[f.city])f.city='village';
  f.travel=null;
  if(f.view==='iso')f.view='rue';
  if(!f.skins||!f.skins.ui)f.skins={ui:{classique:1},city:{normal:1}};
  if(s.crowns==null)f.crowns=2*(f.prestiges||0)+(f.heritage||0);
  if(!f.titles||typeof f.titles!=='object')f.titles={};
  if(!s.goalCrowns){f.crowns=(f.crowns||0)+GOALS.filter(g=>f.goals&&f.goals[g.id]).reduce((a,g)=>a+goalCr(g),0);f.goalCrowns=1}
  if(!f.goalStars){f.stars=(f.stars||0)+Object.keys(f.goals||{}).length;f.goalStars=1}
  f.cnt=Object.assign(fresh().cnt,f.cnt||{});
  if(!f.streak)f.streak={last:'',n:0};
  if(!f.dayStats)f.dayStats={gross:0,trade:0,sal:0,maint:0,int:0};
  for(const k of['contracts','hist'])if(!Array.isArray(f[k]))f[k]=[];
  if(f.dayIdx==null)f.dayIdx=Math.floor(f.clock/DAY);
  if(!(f.mTimer>0))f.mTimer=MT;
  if(!f.elect)f.elect={next:f.dayIdx+10,cands:null,pick:null,don:0};
  if(!WEATHER[f.weather])f.weather='soleil';
  return f;
}
function stepGood(g,st){
  const tgt=S?(SEASONS[season()].good[g.id]||0):0;
  st.x+=-.06/MK*(st.x-tgt)+(st.dt>0?st.drift/MK:0)+randn()*g.vol/Math.sqrt(MK);
  if(st.dt>0)st.dt--;
  st.x=Math.max(-1.25,Math.min(1.25,st.x));
  st.hist.push(g.base*Math.exp(st.x)); if(st.hist.length>60)st.hist.shift();
}

const LAW_BIZ={commerce:{crepe:1.3,kiosque:1.3,boul:1.3,brasserie:1.3},ecolo:{port:.85,atelier:.85}};
function bizLocal(b){
  let m=SEASONS[season()].biz[b.id]||1;
  m*=CITY(C.id).biz[b.id]||1;
  m*=adjOf(b.id);
  m*=(LAW_BIZ[S.law]||{})[b.id]||1;
  const bf=C.buffs[b.id];if(bf&&bf.until>S.clock)m*=bf.m;

function visitors(){return memo('v',()=>{let v=0;BIZ.forEach((b,i)=>v+=lvl(b.id)*1.55**i*1.5);v+=totalStaff()*2;return v*(S.law==='tourisme'?1.25:1)})}
function needCap(n){return memo('n'+n,()=>INFRA.reduce((a,i)=>{if(i.need!==n)return a;let c=Math.max(0,cnt(i.id)-broken('infra',i.id))*i.cap;if(S.law==='ecolo'&&(i.id==='parc'||i.id==='banc'))c*=2;return a+c},0)*(n==='sec'&&S.law==='securite'?1.5:1))}
function needSat(n){const w=(WEATHER[S.weather].need||{})[n]||1;return Math.min(1.25,(needCap(n)+25)/Math.max(1,visitors()*w))}
function satisfaction(){return memo('s',()=>NEEDS.reduce((a,n)=>a+needSat(n.id),0)/NEEDS.length*priceMood())}
function satMult(){const s=satisfaction();return .45+.65*Math.min(s,1)+Math.max(0,s-1)*.8}
const debtMult=()=>S.cash<0?.7:1;
const rivalShops=()=>Object.values(C.rivals).reduce((a,r)=>a+(r.shops||0),0);
const rivalMult=()=>1/(1+rivalShops()*.015);
const crisisMult=()=>S.crisis?CRISES[S.crisis.id].inc():1;
const absorbMult=()=>Math.min(1.5,1+.01*C.absorbed);
let PM=1; // multiplicateur de production commun, recalculé à chaque image
function calcPM(){PM=mkMult()*permMult()*S.boost.m*satMult()*debtMult()*WEATHER[S.weather].inc*rivalMult()*crisisMult()*absorbMult()*(C.priceWar>S.clock?.8:1);return PM}
/* Chaque commerce consomme une marchandise pour produire */
const INPUT={crepe:'ble',kiosque:'cafe',boul:'ble',brasserie:'cafe',cinema:'cafe',atelier:'soie',hotel:'soie',port:'cuivre',centre:'safran',banque:'or',bourse:'or',aeroport:'parfum',tour:'diamant'};
const USE_K=.25,STOCK_MIN=10;
const goodOf=b=>GOODS.find(g=>g.id===INPUT[b.id]);
const needRate=b=>demand(b)*baseProd(b)*(1+empBonus(b))*(BAL.cons?mkMult():1)*USE_K/goodOf(b).base;
const stockCap=b=>Math.max(STOCK_MIN,Math.ceil(needRate(b)*600));
const stockOf=b=>C.stock[b.id]||0;
const supOf=b=>C.supply[b.id]||(C.supply[b.id]={auto:true,buy:false});

/* Prix de vente choisi par le joueur (1 = prix normal) */
const PRICE_K=.7,PRICE_MIN=.5,PRICE_MAX=2.5;
const refPrice=b=>memo('rp'+b.id,()=>{const g=goodOf(b),h=S.goods[g.id].hist.slice(-24),avg=h.reduce((a,x)=>a+x,0)/Math.max(1,h.length)*cityPrice(g.id);return Math.min(1.4,Math.max(.8,Math.sqrt(avg/g.base)))});
const priceP=b=>(C.price&&C.price[b.id])||1;
const priceRatio=b=>priceP(b)/refPrice(b);
const demand=b=>Math.exp(-PRICE_K*(priceRatio(b)-1));
const priceMult=b=>priceP(b)*demand(b);
const MOODS=[[.9,'😍','ravis'],[1.1,'🙂','contents'],[1.35,'😐','râlent un peu'],[1.7,'😠','mécontents'],[99,'🤬','furieux']];

function priceMood(){return memo('pm',()=>{let w=0,a=0;for(const b of BIZ){const l=lvl(b.id);if(!l)continue;w+=l;a+=l*priceRatio(b)}return w?Math.min(1.1,Math.max(.75,1-.3*(a/w-1))):1})}
function setPrice(id,v){const b=BIZ.find(x=>x.id===id);if(!b)return;C.price=C.price||{};let p=v==='ref'?Math.round(refPrice(b)*20)/20:Math.round((priceP(b)+(+v))*100)/100;C.price[id]=Math.min(PRICE_MAX,Math.max(PRICE_MIN,p));MEMO={};sfx('buy');build('biz')}
const dryPct=()=>Math.round((1-BAL.dry)*100);
const bizIncome=b=>(isDry(b)?BAL.dry:1)*priceMult(b)*baseProd(b)*(1+empBonus(b))*bizLocal(b)*PM;
function moveToStock(b,max){const g=goodOf(b),st=S.goods[g.id],room=stockCap(b)-stockOf(b),n=Math.min(st.inv,room,max==null?Infinity:max);if(n<=0)return 0;const avg=st.cost/st.inv;st.inv-=n;st.cost-=avg*n;if(st.inv<1e-6){st.inv=0;st.cost=0}C.stock[b.id]=stockOf(b)+n;return n}
const fillCost=b=>{const n=Math.max(0,Math.ceil(stockCap(b)-stockOf(b)));return {n,c:n*priceOf(goodOf(b))*(1+curFee())}};
function tickSupply(dt){
  for(const b of BIZ){if(!lvl(b.id))continue;const sp=supOf(b),cap=stockCap(b),g=goodOf(b);
    if(C.stock[b.id]==null)C.stock[b.id]=cap;
    if(sp.auto&&stockOf(b)<cap*.5)moveToStock(b);
    if(sp.buy&&stockOf(b)<cap*.25&&S.cash>0){const n=Math.min(Math.ceil(cap-stockOf(b)),Math.floor(S.cash/(priceOf(g)*1.15)));if(n>0){S.cash-=n*priceOf(g)*1.15;C.stock[b.id]=stockOf(b)+n}}
    const use=Math.min(stockOf(b),needRate(b)*dt*(broken('biz',b.id)?.2:1));C.stock[b.id]=stockOf(b)-use;S.cnt.crafted+=use;
    if(stockOf(b)<=1e-6){if(!C.dry[b.id]){C.dry[b.id]=1;setNews('Stock',`${where()}${b.name} n\u2019a plus de ${g.name.toLowerCase()} : il tourne au ralenti (−${dryPct()} % de revenus). Achète-en au marché !`);sfx('alert');vib(50)}}
    else if(C.dry[b.id])C.dry[b.id]=0;
  }
}

function buySupply(id){const b=BIZ.find(x=>x.id===id),g=goodOf(b);if(travelling())return;const unit=priceOf(g)*(1+curFee()),n=Math.min(Math.ceil(stockCap(b)-stockOf(b)),Math.floor(Math.max(0,S.cash)/unit));if(n<=0)return toast(stockOf(b)>=stockCap(b)?'Le stock est déjà plein.':'Pas assez d\u2019argent.');if(!confirmBig('sup'+id,n*unit,`${fmt(n)} ${pl(n,g.unit)} de ${g.name.toLowerCase()}`))return;S.cash-=n*unit;C.stock[b.id]=stockOf(b)+n;sfx('buy');toast(`${b.name} réapprovisionné : ${fmt(n)} ${pl(n,g.unit)} pour ${eur(n*unit)}`)}
function setSupply(id,m){const b=BIZ.find(x=>x.id===id),sp=supOf(b);sp[m]=!sp[m];toast(m==='auto'?(sp.auto?'Réappro auto depuis l\u2019entrepôt : activé':'Réappro auto : désactivé'):(sp.buy?'Commande auto au marché (+15 %) : activée':'Commande auto : désactivée'));build('biz')}

let armedKey=null,armedAt=0;
function confirmBig(key,cost,label){
  if(!SET.confirm||cost<Math.max(0,S.cash)*.5||cost<1000)return true;
  if(armedKey===key&&Date.now()-armedAt<3500){armedKey=null;return true}
  armedKey=key;armedAt=Date.now();toast(`Touche encore pour confirmer : ${label} pour ${eur(cost)}`);return false;
}
function travelling(){if(S.travel){toast(`Tu es en route vers ${CITY(S.travel.to).n}. Le marché sera ouvert à ton arrivée.`);return true}return false}
function buyGood(id,n){
  if(travelling())return;
  const g=GOODS.find(x=>x.id===id),st=S.goods[id],unit=priceOf(g)*(1+curFee());
  const free=Math.floor(capacity()-used());
  if(free<=0)return toast('Entrepôt plein. Vends ou agrandis-le.');
  n=Math.min(n,free,Math.floor(Math.max(0,S.cash)/unit));
  if(n<=0)return toast('Pas assez d’argent.');
  if(!confirmBig('g'+id+n,n*unit,`${fmt(n)} ${pl(n,g.unit)}`))return;
  S.cash-=n*unit;st.inv+=n;st.cost+=n*unit;st.lock=S.tick||0;sfx('buy');refresh();
}
const locked=st=>st.lock!=null&&st.lock===(S.tick||0);
function sellGood(id){
  if(travelling())return;
  if(locked(S.goods[id]))return toast(`Tu viens d\u2019acheter : revente possible au prochain cours, dans ${Math.ceil(S.mTimer)} s.`);
  const g=GOODS.find(x=>x.id===id),st=S.goods[id];if(st.inv<1)return;
  const rev=st.inv*priceOf(g)*(1-curFee())*sellBonus(),profit=rev-st.cost;
  S.cash+=rev;addTrade(profit);
  if(profit>0){S.sold++;S.cnt.sold++}
  S.bestFlip=Math.max(S.bestFlip,rev/Math.max(1e-9,st.cost));
  floatTxt(sgn(profit),profit>=0?T.good:T.bad);sfx(profit>=0?'sell':'bad');vib(profit>=0?20:60);if(profit>0){const bb=$('s-'+id);if(bb){const r=bb.getBoundingClientRect();coinsTo(r.left+r.width/2,r.top,5)}}
  toast(`${fmt(Math.floor(st.inv))} ${pl(st.inv,g.unit)} de ${g.name.toLowerCase()} vendus : ${profit>=0?'bénéfice':'perte'} ${eur(Math.abs(profit))}`);
  st.inv=0;st.cost=0;refresh();
}
function buyBiz(id){
  const b=BIZ.find(x=>x.id===id),n=bizQty(b),c=bizCost(b,n);

  const before=bizMult(lvl(id));
  const wasNew=!lvl(id);S.cash-=c;C.biz[id]=lvl(id)+n;sfx('buy');if(wasNew){C.stock[id]=Math.ceil(stockCap(b)*.4);setNews('Stock',`${b.name} ouvert avec un petit stock de ${goodOf(b).name.toLowerCase()}. Pense à en racheter au marché !`)}

  else if(lvl(id)%10===0)toast(`${b.name} : une place de plus pour embaucher`);

}

function genContract(){

  const budget=Math.max(150,(Math.max(0,S.cash)+incAll()*120)*(.25+Math.random()*.6));
  const qty=Math.max(3,Math.min(Math.floor(capacity()*.6),Math.round(budget/g.base)));
  const reward=qty*g.base*(BAL.contract[0]+Math.random()*BAL.contract[1])*(1+.25*(S.upg.vip||0));
  const c={id:'c'+uid(),g:g.id,qty,reward,until:S.clock+300+Math.random()*300,who:pick(CLIENTS)};
  S.contracts.push(c);S.nextContract=S.clock+80+Math.random()*80;
  setNews('Commande',`${c.who} veut ${qty} ${pl(qty,g.unit)} de ${g.name.toLowerCase()}. Regarde le marché !`);
}
function deliver(cid){
  if(travelling())return;
  const c=S.contracts.find(x=>x.id===cid);if(!c)return;
  const g=GOODS.find(x=>x.id===c.g),st=S.goods[c.g];
  if(st.inv<c.qty)return toast(`Il te manque ${fmt(Math.ceil(c.qty-st.inv))} ${pl(c.qty-st.inv,g.unit)}.`);
  const part=st.cost/st.inv*c.qty;st.inv-=c.qty;st.cost-=part;if(st.inv<=0){st.inv=0;st.cost=0}
  const profit=c.reward-part;S.cash+=c.reward;addTrade(profit);
  S.contractsDone++;S.cnt.contracts++;S.contracts=S.contracts.filter(x=>x!==c);
  floatTxt(sgn(profit),T.gold);sfx('coin');vib(30);{const bb=document.querySelector(`[data-c="${cid}"]`);if(bb){const r=bb.getBoundingClientRect();coinsTo(r.left+r.width/2,r.top,7)}}toast(`Commande livrée à ${c.who} : ${eur(c.reward)} (bénéfice ${eur(profit)})`);
  build('market');
}

function spawnBreak(){
  const pool=[];
  BIZ.forEach(b=>{if(lvl(b.id)&&!broken('biz',b.id))pool.push({kind:'biz',ref:b.id,w:1+Math.log10(lvl(b.id)+1)})});

  if(!pool.length||C.broken.length>=8||totalLv()<5)return;
  const tw=pool.reduce((a,x)=>a+x.w,0);let r=Math.random()*tw,x=pool[0];for(const p of pool){r-=p.w;if(r<=0){x=p;break}}

function tickEmployees(dt){

function checkDaily(){
  const t=todayStr();

    const y=new Date();y.setDate(y.getDate()-1);
    S.streak.n=S.streak.last===todayStr(y)?S.streak.n+1:1;S.streak.last=t;
    const n=Math.min(S.streak.n,7),cash=Math.max(100,incAll()*120)*n;
    earn(cash);S.stars+=n;
    setNews('Connexion',`Jour ${S.streak.n} d’affilée : +${eur(cash)} et +${n} étoile${n>1?'s':''} ★`);
    setTimeout(()=>{toast(`Bonus de connexion (jour ${S.streak.n}) : +${eur(cash)} et +${n} ★`);sfx('coin')},800);
  }
  if(!S.daily||S.daily.date!==t){
    const pool=CHALLENGES.filter(c=>!c.cond||c.cond());const c=pool[(new Date().getDate()*7+new Date().getMonth())%pool.length];

function drawChart(){
  const c=$('fchart');if(!c)return;const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=130;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const d=S.hist,vals=d.map(p=>p.cash),mn=Math.min(0,...vals),mx=Math.max(...vals,1),pad=8,r=mx-mn||1;
  const X=i=>pad+i/(d.length-1)*(w-pad*2),Y=v=>h-18-(v-mn)/r*(h-34);
  x.strokeStyle=T.ink;x.globalAlpha=.12;x.lineWidth=1;for(let k=0;k<=2;k++){const yy=Y(mn+r*k/2);x.beginPath();x.moveTo(pad,yy);x.lineTo(w-pad,yy);x.stroke()}x.globalAlpha=1;
  if(mn<0){x.strokeStyle=T.bad;x.globalAlpha=.6;x.beginPath();x.moveTo(pad,Y(0));x.lineTo(w-pad,Y(0));x.stroke();x.globalAlpha=1}
  x.beginPath();d.forEach((p,i)=>i?x.lineTo(X(i),Y(p.cash)):x.moveTo(X(i),Y(p.cash)));x.strokeStyle=T.gold;x.lineWidth=2.2;x.stroke();
  x.lineTo(X(d.length-1),Y(mn));x.lineTo(X(0),Y(mn));x.closePath();x.globalAlpha=.15;x.fillStyle=T.gold;x.fill();x.globalAlpha=1;
  const li=d.length-1;x.beginPath();x.arc(X(li),Y(d[li].cash),3.5,0,7);x.fillStyle=T.gold;x.fill();
  x.fillStyle=T.ink;x.globalAlpha=.7;x.font='500 10px "DM Mono",monospace';x.textAlign='left';x.fillText('max '+eur(mx),pad,10);x.textAlign='center';
  d.forEach((p,i)=>{if(i%Math.ceil(d.length/6)===0||i===li)x.fillText('J'+p.day,Math.min(w-14,Math.max(14,X(i))),h-4)});x.globalAlpha=1;
}

let toastT;
const TQ=[];let toastOn=false;
function toast(m){if(TQ.includes(m)||($('toast').textContent===m&&toastOn))return;TQ.push(m);if(TQ.length>3)TQ.splice(0,TQ.length-3);if(!toastOn)nextToast()}
function nextToast(){const t=$('toast'),m=TQ.shift();if(!m){toastOn=false;t.classList.remove('show');return}toastOn=true;t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,220)},Math.min(3600,1600+m.length*25))}

const FX={c:null,x:null,parts:[],run:false};
function fxInit(){if(FX.c)return;FX.c=$('fx');FX.x=FX.c.getContext('2d')}
function fxSize(){const d=Math.min(2,devicePixelRatio||1);FX.c.width=innerWidth*d;FX.c.height=innerHeight*d;FX.x.setTransform(d,0,0,d,0,0)}
function fxLoop(){const x=FX.x;x.clearRect(0,0,innerWidth,innerHeight);
  FX.parts=FX.parts.filter(p=>(p.t+=1/60)<p.life);

    else if(left<150)L.push({k:'w'+c.id,hot:1,t:`${c.who} attend sa commande`,s:`Il manque ${fmt(Math.ceil(c.qty-st.inv))} ${pl(c.qty-st.inv,g.unit)} de ${g.name.toLowerCase()} · reste ${mmss(left)}`,b:[['alt sm','go',{t:'market'},'Marché',null]]})}

    L.push({k:'sk'+b.id+(st<=0?'0':'1'),hot:st<=0,t:st<=0?`${b.name} est à sec`:`${b.name} : stock bas`,s:`${g.name} : ${fmt(Math.floor(st))}/${fmt(cap)}${st<=0?` · revenus −${dryPct()} %`:''}`,b:[...(wh?[['alt sm','restock',{b:b.id},'Entrepôt',null]]:[]),['sm','bsupply',{b:b.id},'Remplir',fillCost(b).c]]})}
  for(const x of C.broken)L.push({k:'b'+x.id,hot:!C.techs,t:`${x.label} : en panne`,s:C.techs?'Un technicien est dessus':'Aucun technicien pour réparer',b:[['danger sm','rush',{x:x.id},'Urgence',rushCost(x)],...(C.techs?[]:[['alt sm','tech',{},'Technicien',techCost()]])]});

    const st=list.filter(e=>e.strike);if(st.length)L.push({k:'s'+b.id+st.length,hot:1,t:`${st.length} en grève · ${b.name}`,s:st.map(e=>e.n).join(', '),b:[['sm','prime',{b:b.id},'Prime',salaryOf(b)*90+20]]})}
  for(const n of NEEDS){const v=needSat(n.id);if(v>=.7||visitors()<30)continue;
    const opts=visibleInfra().filter(i=>i.need===n.id).sort((a,b)=>infraCost(a)-infraCost(b));const best=opts.filter(i=>infraCost(i)<=S.cash).pop()||opts[0];
    L.push({k:'n'+n.id,hot:v<.5,t:`${n.name} insuffisante (${pct(v)})`,s:best?`${best.name} : +${fmt(best.cap)} visiteurs`:'Va voir les équipements',b:best?[['sm','infra',{i:best.id},'Installer',infraCost(best)]]:[['alt sm','go',{t:'city'},'Ville',null]]})}
  if(S.daily&&!S.daily.done&&dailyProg()>=S.daily.n)L.push({k:'daily',t:'Défi du jour réussi !',s:'Récupère ta récompense et 3 étoiles',b:[['sell sm','daily',{},'Récupérer',null]]});
  if(S.elect.cands&&S.elect.pick==null&&S.elect.next-S.dayIdx<=2)L.push({k:'vote',t:'Élections bientôt',s:`Vote dans ${S.elect.next-S.dayIdx} jour${S.elect.next-S.dayIdx>1?'s':''}, tu ne soutiens personne`,b:[['alt sm','go',{t:'city'},'Voir',null]]});
  const rs=rivalShops();if(rs>=10)L.push({k:'riv',t:`Les concurrents te volent ${Math.round((1-rivalMult())*100)} % de clients`,s:`${rs} boutiques concurrentes à ${CITY(C.id).n}`,b:[['alt sm','go',{t:'city'},'Riposter',null]]});
  return L.sort((a,b)=>(b.hot||0)-(a.hot||0));
}
function nextTip(){
  const free=BIZ.find(b=>!lvl(b.id));const first=BIZ.find(b=>lvl(b.id));
  if(!first)return {t:'Ouvre ton premier stand de crêpes : il transforme du blé en argent.',b:['go','biz','Commerces']};
  {const d=BIZ.find(b=>isDry(b));if(d)return {t:`${d.name} n\u2019a plus de ${goodOf(d).name.toLowerCase()} : achète-en au marché pour qu\u2019il retrouve tous ses revenus.`,b:['go','market','Marché']}}
  {const lo=BIZ.find(b=>lvl(b.id)&&stockOf(b)<stockCap(b)*.3&&!supOf(b).buy);if(lo&&S.goods[goodOf(lo).id].inv<1)return {t:`Le stock de ${goodOf(lo).name.toLowerCase()} de ${lo.name.toLowerCase()} baisse : achète-en quand le prix est bas.`,b:['go','market','Marché']}}
  if(lvl('crepe')<10&&bizCost(BIZ[0],1)<=S.cash)return {t:'Agrandis ton stand de crêpes jusqu\u2019au niveau 10 : sa production double.',b:['go','biz','Commerces']};
  for(const g of unlockedGoods()){const st=S.goods[g.id];if(st.inv>=1){const val=st.inv*priceOf(g)*(1-curFee())*sellBonus();if(val>st.cost*1.12&&!locked(st))return {t:`Ton ${g.name.toLowerCase()} vaut plus que ce que tu l\u2019as payé : tu peux le vendre avec bénéfice.`,b:['go','market','Marché']}}}
  if(unlocked('city')&&satisfaction()<.8){const n=NEEDS.slice().sort((a,b)=>needSat(a.id)-needSat(b.id))[0];return {t:`Tes visiteurs manquent de ${n.name.toLowerCase()} : ajoute un équipement dans l\u2019onglet Ville.`,b:['go','city','Ville']}}
  if(used()>=capacity()&&capacity()<cap(12))return {t:'Ton entrepôt est plein : agrandis-le dans Améliorer.',b:['go','upg','Améliorer']};
  for(const g of unlockedGoods()){const p=priceOf(g)/g.base;if(p<.75&&S.cash>priceOf(g)*5&&used()<capacity())return {t:`Le ${g.name.toLowerCase()} est bas en ce moment : c\u2019est le moment d\u2019en acheter.`,b:['go','market','Marché']}}
  if(unlocked('staff')&&totalStaff()===0)return {t:'Embauche quelqu\u2019un dans un commerce de niveau 10 : +25 % de clients.',b:['go','biz','Commerces']};
  if(free&&free.cost*bizDisc()<=S.cash)return {t:`Tu as de quoi ouvrir : ${free.name.toLowerCase()}.`,b:['go','biz','Commerces']};
  if(free)return {t:`Prochain objectif : ${free.name.toLowerCase()}, il te manque ${eur(free.cost*bizDisc()-S.cash)}.`,b:null};
  return null;
}

/* ======================================================================
   Villes : voyager et fonder
   ====================================================================== */
function travelTo(id){
  if(!S.cities[id])return;
  if(S.travel)return toast(`Tu es déjà en route vers ${CITY(S.travel.to).n}.`);
  if(id===S.city)return toast(`Tu es déjà à ${CITY(id).n}.`);
  const t=[20,10,3][S.upg.jet||0];S.travel={to:id,until:S.clock+t};
  sfx('tick');toast(`Départ pour ${CITY(id).n} (${t} s)`);renderBanner(true);build(tab);
}
function foundCity(id){
  const cd=CITY(id);if(S.cities[id])return;
  if(S.run.earned<cd.cost*.4)return toast(`Gagne d’abord ${eur(cd.cost*.4)} dans la partie.`);
  if(cd.cost>S.cash)return toast('Pas assez d’argent.');
  if(!confirmBig('city'+id,cd.cost,`Fonder ${cd.n}`))return;
  S.cash-=cd.cost;S.cities[id]=newCity(id,S.clock);sfx('level');vib([40,30,40]);celebrate();
  setNews('Expansion',`Tu fondes ${cd.n} ! ${cd.d}`);toast(`${cd.n} fondée ! En route…`);
  travelTo(id);
}
function arrive(){
  S.city=S.travel.to;S.travel=null;C=activeC();MEMO={};planSel=null;closeSheet();ensureGrid();sizeCanvas();
  setNews('Voyage',`Bienvenue à ${CITY(S.city).n} ! ${CITY(S.city).d}`);sfx('level');renderBanner(true);build(tab);window.scrollTo({top:0,behavior:'smooth'});
}

/* ======================================================================
   Boucle principale : logique 10 fois par seconde, dessin 30 images/s max
   ====================================================================== */
let lastWall=Date.now(),logicAcc=0,drawAcc=0,uiAcc=0,saveAcc=0,gAcc=0,cloudAcc=0,dailyAcc=0,townVisible=true;
try{new IntersectionObserver(es=>{townVisible=es[0].isIntersecting}).observe($('townbox'))}catch(e){}
function step(dt){
  MEMO={};
  S.clock+=dt;
  if(S.boost.m!==1&&S.clock>S.boost.until)S.boost={m:1,until:0};
  if(S.crisis&&S.clock>S.crisis.until){setNews('Crise',`${CRISES[S.crisis.id].n} : c’est terminé.`);S.crisis=null}
  if(S.special&&S.clock>S.special.until){setNews('Visite',`${SPECIALS[S.special.id].n} est reparti${S.special.id==='star'?'e':''}.`);S.special=null}
  if(S.travel&&S.clock>=S.travel.until)arrive();
  let gross=0,sal=0,mt=0;
  forCities(()=>{calcPM();gross+=grossIncome();sal+=salaries()+techPay();mt+=maintenance();
    if(S.clock>=C.nextBreak)spawnBreak();tickRepairs(dt);tickSupply(dt)});
  C=activeC();calcPM();
  const it=interest();GROSS_ALL=gross;COSTS_ALL=sal+mt+it;
  earn(gross*dt);S.cash-=COSTS_ALL*dt;
  const ds=S.dayStats;ds.gross+=gross*dt;ds.sal+=sal*dt;ds.maint+=mt*dt;ds.int+=it*dt;
  if(S.cash<0&&!S.inDebt){S.inDebt=true;setNews('Alerte','Tu es dans le rouge ! Tes commerces tournent à 70 %. Licencie, retire des équipements ou vends du stock.');sfx('alert');vib([60,40,60])}
  else if(S.cash>=0&&S.inDebt)S.inDebt=false;
  S.mTimer-=dt;
  if(S.mTimer<=0){S.mTimer=MT;S.tick=(S.tick||0)+1;GOODS.forEach(g=>stepGood(g,S.goods[g.id]));if(tab==='market'){drawSparks();sfx('tick')}}
  if(Math.floor(S.clock/DAY)>S.dayIdx)endDay();
  if(S.clock>=S.nextNews)fireNews();
  if(!op&&S.clock>=S.nextOp)spawnOp();
  if(S.contracts.length<3&&S.clock>=S.nextContract&&S.run.earned>=30)genContract();
  if(S.contracts.some(c=>S.clock>c.until)){const lost=S.contracts.filter(c=>S.clock>c.until);S.contracts=S.contracts.filter(c=>S.clock<=c.until);toast(`Commande annulée : ${lost[0].who} n’a pas été livré à temps`)}
  if(!S.crisis&&S.clock>=S.nextCrisis&&S.run.earned>=2e4)startCrisis();
  if(!S.special&&S.clock>=S.nextSpecial)startSpecial();
  gAcc+=dt;if(gAcc>=1){const g=gAcc;gAcc=0;forCities(()=>{calcPM();tickEmployees(g);ensureGrid()});C=activeC();MEMO={};calcPM();checkGoals()}
  uiAcc+=dt;if(uiAcc>=.25){uiAcc=0;refresh();musicTick()}
  saveAcc+=dt;if(saveAcc>5){saveAcc=0;save()}
  cloudAcc+=dt;if(cloudAcc>60){cloudAcc=0;if(SET.cloudAuto)pushCloud(true)}
  dailyAcc+=dt;if(dailyAcc>60){dailyAcc=0;checkDaily()}
}
let DISP=null,cashFlash=0;
function animCash(dt){
  const el=$('cash');if(DISP==null||!isFinite(DISP))DISP=S.cash;
  const d=S.cash-DISP;if(d>Math.max(1,Math.abs(DISP)*.002))cashFlash=.6;
  DISP+=d*Math.min(1,dt*7);if(Math.abs(S.cash-DISP)<Math.max(.005,Math.abs(S.cash)*5e-5))DISP=S.cash;
  const t=eur(DISP);if(el.textContent!==t){el.textContent=t;el.style.fontSize=t.length>11?(11/t.length).toFixed(3)+'em':''}
  cashFlash=Math.max(0,cashFlash-dt);el.classList.toggle('up',cashFlash>0&&S.cash>=0);
}
function frame(){
  const now=Date.now();let dt=(now-lastWall)/1000;lastWall=now;
  if(dt>5){applyOffline(dt);build(tab);dt=0}
  dt=Math.min(dt,.5);
  logicAcc+=dt;if(logicAcc>=.1){step(Math.min(logicAcc,.5));logicAcc=0}
  animCash(dt);
  drawAcc+=dt;
  if(townVisible&&drawAcc>=(lowAnim()?.066:.033)){draw(Math.min(drawAcc,.2));drawAcc=0}
  requestAnimationFrame(frame);
}
function start(){
  const had=load();
  if(had&&S.t)applyOffline((Date.now()-S.t)/1000);
  if(!S.elect.cands)newElection();
  forCities(()=>ensureGrid());C=activeC();checkUnlocks(true);
  applyTheme();sizeCanvas();checkDaily();
  GROSS_ALL=allGross();COSTS_ALL=allCosts();build(tab);
  lastWall=Date.now();requestAnimationFrame(frame);
}
addEventListener('resize',()=>{sizeCanvas();if(FX.run)fxSize()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(SET.cloudAuto)pushCloud(true);if(AC)AC.suspend()}else if(AC)AC.resume()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readTokens();drawSparks()})}catch(e){}
start();
initCloud();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
